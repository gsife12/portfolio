<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1120" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,400..600;1,14..32,400&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon: GS initials in a rounded square -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231558C0'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' fill='white' font-family='Georgia,serif' font-size='14' font-weight='700'%3EGS%3C/text%3E%3C/svg%3E"
    />

    <!-- SEO base — React updates these per-route via useSEO -->
    <title>Gideon Sife | Junior AI Software Engineer</title>
    <meta
      name="description"
      content="Gideon Sife — Junior AI Software Engineer and Computer Science student at Towson University building full-stack applications, REST APIs, and AI-assisted software."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gideon Sife | Junior AI Software Engineer" />
    <meta
      property="og:description"
      content="Gideon Sife — Junior AI Software Engineer and Computer Science student at Towson University building full-stack applications, REST APIs, and AI-assisted software."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Inline script: apply saved theme before first paint to prevent flash -->
    <script>
      ;(function () {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
